<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대포 뽑기</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #1a1a2e;
    font-family: 'Do Hyeon', sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  #outter {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #field {
    flex: 1;
    position: relative;
    background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 58%, #5a8f2a 58%, #3d6b1a 100%);
    overflow: hidden;
  }
  #myCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #log {
    height: 130px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    overflow-y: auto;
    padding: 8px 14px;
    font-size: 1.15rem;
    border-top: 3px solid #ffcc00;
  }
  .log-inner { margin-bottom: 3px; }
  .control-bar {
    background: #111;
    padding: 12px;
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
  }
  .btn-launch {
    background: linear-gradient(to bottom, #ff5555, #cc0000);
    border: none;
    color: white;
    font-size: 1.5rem;
    padding: 12px 48px;
    border-radius: 50px;
    box-shadow: 0 5px 0 #880000;
    transition: all 0.1s;
  }
  .btn-launch:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #880000;
  }
  .btn-launch:disabled {
    background: #555;
    box-shadow: none;
    cursor: not-allowed;
  }
  .font-dh { font-family: 'Do Hyeon', sans-serif; }
</style>
</head>
<body>
  <div class="modal fade" id="modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title font-dh">대포 뽑기 설정</h5>
        </div>
        <div class="modal-body">
          <form id="option">
            <div class="mb-3">
              <label class="form-label">총 공 개수 (3 ~ 10000)</label>
              <input type="number" class="form-control form-control-lg" name="txt" min="3" max="10000" value="20" required>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" name="chk1" id="chk1">
              <label class="form-check-label" for="chk1">중복 허용</label>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" name="chk2" id="chk2" checked>
              <label class="form-check-label" for="chk2">전체화면 모드</label>
            </div>
            <div id="lb1" class="text-danger" style="display:none;">숫자를 입력해주세요.</div>
            <div id="lb2" class="text-danger" style="display:none;">3 이상 10000 이하의 정수만 가능합니다.</div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary btn-lg font-dh px-5" onclick="start()">시작!</button>
        </div>
      </div>
    </div>
  </div>

  <div id="outter">
    <div id="field">
      <canvas id="myCanvas"></canvas>
    </div>
    <div id="log"></div>
    <div class="control-bar">
      <button id="btnLaunch" class="btn-launch font-dh" onclick="launch()" disabled>발사!</button>
      <button class="btn btn-outline-light font-dh" onclick="reload()">다시 시작</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
'use strict';

const myModal = new bootstrap.Modal(document.getElementById('modal'), {});
myModal.show();

let seqArray = [];
let isOverlapped = false;
let cnt = 0;
let isFlying = false;
let shake = 0;

const field = document.getElementById('field');
const canvas = document.getElementById('myCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = field.offsetWidth;
  canvas.height = field.offsetHeight;
}
window.addEventListener('resize', resize);
resize();

const gravity = 0.42;
const groundY = () => canvas.height * 0.78;

const ball = {
  x: 0, y: 0, vx: 0, vy: 0,
  radius: 28, num: null,
  active: false, landed: false, bounce: 0
};

let particles = [];

/* ====================== 진짜 대포 그리기 ====================== */
function drawCannon() {
  const gx = 95;          // 대포 기준 x
  const gy = groundY();   // 땅 높이

  // ---- 그림자 ----
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(gx + 30, gy + 12, 95, 18, 0, 0, Math.PI * 2);
  ctx.fill();

  // ---- 바퀴 (왼쪽) ----
  drawWheel(gx - 28, gy - 8, 38);
  // ---- 바퀴 (오른쪽) ----
  drawWheel(gx + 55, gy - 8, 38);

  // ---- 차대 (나무) ----
  // 메인 빔
  const woodGrad = ctx.createLinearGradient(gx - 50, gy - 40, gx + 80, gy - 10);
  woodGrad.addColorStop(0, '#5c3a21');
  woodGrad.addColorStop(0.4, '#8b5a2b');
  woodGrad.addColorStop(1, '#4a2f18');
  ctx.fillStyle = woodGrad;

  // 뒤쪽 차대
  ctx.beginPath();
  ctx.moveTo(gx - 55, gy - 15);
  ctx.lineTo(gx - 45, gy - 55);
  ctx.lineTo(gx + 25, gy - 48);
  ctx.lineTo(gx + 40, gy - 12);
  ctx.closePath();
  ctx.fill();

  // 앞쪽 받침
  ctx.beginPath();
  ctx.moveTo(gx + 20, gy - 18);
  ctx.lineTo(gx + 75, gy - 22);
  ctx.lineTo(gx + 78, gy - 8);
  ctx.lineTo(gx + 25, gy - 5);
  ctx.closePath();
  ctx.fill();

  // 나무 결
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(gx - 40 + i * 12, gy - 50);
    ctx.lineTo(gx - 30 + i * 12, gy - 15);
    ctx.stroke();
  }

  // ---- 포신 받침 (트러니언) ----
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(gx + 8, gy - 62, 14, 28);
  ctx.fillRect(gx + 48, gy - 58, 14, 24);

  // ---- 포신 ----
  ctx.save();
  ctx.translate(gx + 35, gy - 55);
  ctx.rotate(-0.52); // 발사 각도

  // 포신 본체 (길쭉한 원통 느낌)
  const barrelGrad = ctx.createLinearGradient(0, -22, 0, 22);
  barrelGrad.addColorStop(0, '#6a6a6a');
  barrelGrad.addColorStop(0.3, '#9a9a9a');
  barrelGrad.addColorStop(0.7, '#555');
  barrelGrad.addColorStop(1, '#333');
  ctx.fillStyle = barrelGrad;

  // 메인 포신
  roundRect(ctx, 0, -18, 125, 36, 6);
  ctx.fill();

  // 포신 링들
  ctx.fillStyle = '#222';
  ctx.fillRect(15, -20, 8, 40);
  ctx.fillRect(55, -20, 7, 40);
  ctx.fillRect(95, -21, 9, 42);

  // 포구 (입구)
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(125, 0, 20, 0, Math.PI * 2);
  ctx.fill();

  // 포구 안쪽 구멍
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(125, 0, 13, 0, Math.PI * 2);
  ctx.fill();

  // 포구 금속 테두리
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(125, 0, 20, 0, Math.PI * 2);
  ctx.stroke();

  // 작은 하이라이트
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(10, -12);
  ctx.lineTo(110, -12);
  ctx.stroke();

  ctx.restore();

  // ---- 작은 장식품 (점화구 느낌) ----
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(gx + 22, gy - 68, 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawWheel(cx, cy, r) {
  // 타이어/림
  const rimGrad = ctx.createRadialGradient(cx - 8, cy - 8, 5, cx, cy, r);
  rimGrad.addColorStop(0, '#666');
  rimGrad.addColorStop(0.7, '#333');
  rimGrad.addColorStop(1, '#111');
  ctx.fillStyle = rimGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // 나무 바퀴살 배경
  ctx.fillStyle = '#6b4423';
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2);
  ctx.fill();

  // 바퀴살
  ctx.strokeStyle = '#3d2512';
  ctx.lineWidth = 5;
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang) * r * 0.72, cy + Math.sin(ang) * r * 0.72);
    ctx.stroke();
  }

  // 중심 허브
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(cx, cy, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fill();

  // 바깥 림 테두리
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ====================== 파티클 ====================== */
function spawnMuzzleFlash(x, y) {
  for (let i = 0; i < 30; i++) {
    particles.push({
      x, y,
      vx: Math.random() * 14 + 5,
      vy: (Math.random() - 0.55) * 11,
      life: 25 + Math.random() * 25,
      maxLife: 50,
      size: 3 + Math.random() * 6,
      color: `hsl(${25 + Math.random() * 25}, 100%, ${55 + Math.random() * 25}%)`,
      type: 'spark'
    });
  }
  for (let i = 0; i < 20; i++) {
    particles.push({
      x: x + Math.random() * 15,
      y: y + (Math.random() - 0.5) * 25,
      vx: Math.random() * 4 + 1.5,
      vy: (Math.random() - 0.7) * 5,
      life: 45 + Math.random() * 40,
      maxLife: 85,
      size: 14 + Math.random() * 22,
      color: `rgba(160,160,160,${0.35 + Math.random() * 0.3})`,
      type: 'smoke'
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.06;
    p.life--;
    if (p.type === 'smoke') {
      p.size += 0.35;
      p.vx *= 0.96;
    }
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (p.type === 'spark' ? alpha : 1), 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* ====================== 공 ====================== */
function drawBall() {
  if (!ball.active) return;
  const r = ball.radius;

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(ball.x, groundY() + 6, r * 0.95, r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  // 공
  const grad = ctx.createRadialGradient(
    ball.x - r * 0.35, ball.y - r * 0.35, r * 0.1,
    ball.x, ball.y, r
  );
  grad.addColorStop(0, '#7aff55');
  grad.addColorStop(0.55, '#22cc00');
  grad.addColorStop(1, '#0a5a00');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
  ctx.fill();

  // 하이라이트
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.arc(ball.x - r * 0.3, ball.y - r * 0.32, r * 0.32, 0, Math.PI * 2);
  ctx.fill();

  // 숫자
  if (ball.num !== null) {
    ctx.fillStyle = '#ffee00';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3.5;
    const fontSize = Math.max(20, r * 0.95);
    ctx.font = `bold ${fontSize}px Do Hyeon`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeText(ball.num, ball.x, ball.y + 2);
    ctx.fillText(ball.num, ball.x, ball.y + 2);
  }
}

/* ====================== 메인 루프 ====================== */
function loop() {
  requestAnimationFrame(loop);

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.88;
    if (shake < 0.4) shake = 0;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 간단한 구름
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(canvas.width * 0.72, canvas.height * 0.15, 90, 28, 0, 0, Math.PI * 2);
  ctx.ellipse(canvas.width * 0.78, canvas.height * 0.13, 55, 22, 0, 0, Math.PI * 2);
  ctx.ellipse(canvas.width * 0.25, canvas.height * 0.11, 70, 24, 0, 0, Math.PI * 2);
  ctx.fill();

  // 땅 경계
  ctx.strokeStyle = '#2d5016';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, groundY());
  ctx.lineTo(canvas.width, groundY());
  ctx.stroke();

  drawCannon();
  updateParticles();
  drawParticles();

  if (ball.active && !ball.landed) {
    ball.vy += gravity;
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y + ball.radius >= groundY()) {
      ball.y = groundY() - ball.radius;
      ball.vy *= -0.42;
      ball.vx *= 0.72;
      ball.bounce++;
      if (Math.abs(ball.vy) < 2.2 || ball.bounce > 3) {
        ball.landed = true;
        ball.vy = 0;
        ball.vx = 0;
        isFlying = false;
        document.getElementById('btnLaunch').disabled = false;
      }
    }
  }

  drawBall();
  ctx.restore();
}

/* ====================== 발사 ====================== */
function launch() {
  if (isFlying) return;

  let num;
  if (isOverlapped) {
    num = seqArray[Math.floor(Math.random() * seqArray.length)];
  } else {
    if (cnt >= seqArray.length) {
      document.getElementById('log').innerHTML +=
        '<div class="log-inner font-dh text-warning">모든 공을 발사하였습니다!</div>';
      document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
      document.getElementById('btnLaunch').disabled = true;
      return;
    }
    num = seqArray[cnt];
  }

  // 포구 위치 (각도 맞춰서 계산)
  const muzzleX = 210;
  const muzzleY = groundY() - 95;

  ball.x = muzzleX;
  ball.y = muzzleY;
  ball.vx = 12.5 + Math.random() * 2.5;
  ball.vy = -13.5 - Math.random() * 2.5;
  ball.radius = 25 + Math.random() * 5;
  ball.num = num;
  ball.active = true;
  ball.landed = false;
  ball.bounce = 0;

  spawnMuzzleFlash(muzzleX + 15, muzzleY);
  shake = 14;
  isFlying = true;

  const log = document.getElementById('log');
  log.innerHTML += `
    <div class="log-inner d-flex justify-content-between font-dh">
      <span>[${cnt + 1}]</span>
      <span class="text-warning">${num}번</span>
    </div>`;
  log.scrollTop = log.scrollHeight;

  cnt++;
  document.getElementById('btnLaunch').disabled = true;
}

function start() {
  const form = document.getElementById('option');
  const num = form.txt.value;
  const chk1 = form.chk1.checked;
  const chk2 = form.chk2.checked;

  if (num === '' || isNaN(num)) {
    document.getElementById('lb1').style.display = 'block';
    document.getElementById('lb2').style.display = 'none';
    return;
  }
  if (num < 3 || num > 10000 || num != Math.floor(num)) {
    document.getElementById('lb1').style.display = 'none';
    document.getElementById('lb2').style.display = 'block';
    return;
  }

  myModal.hide();

  seqArray = [];
  for (let i = 0; i < num; i++) seqArray.push(i + 1);
  for (let i = seqArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [seqArray[i], seqArray[j]] = [seqArray[j], seqArray[i]];
  }

  isOverlapped = chk1;
  cnt = 0;

  document.getElementById('btnLaunch').disabled = false;
  document.getElementById('log').innerHTML = '';
  resize();
  loop();
}

function reload() {
  location.reload();
}
</script>
</body>
</html>
